        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 110px; }

        header { background-color: #121212; padding: 15px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .designer-tag { text-align: center; color: var(--accent-color); font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
        .header-main { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto; }
        .brand-title { font-size: 1.3rem; font-weight: 800; color: var(--accent-color); }

        .categories-wrapper { background: #121212; border-bottom: 1px solid var(--border-color); position: sticky; top: 75px; z-index: 99; }
        .categories-nav { display: flex; overflow-x: auto; gap: 10px; padding: 12px 15px; max-width: 600px; margin: 0 auto; }
        .cat-btn { background: #222; color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .item-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        
        .item-title-group { display: flex; flex-direction: column; }
        .item-name-ar { font-size: 1.1rem; font-weight: 800; color: #fff; }

        .status-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 700; }
        .status-badge.available { background: rgba(46, 204, 113, 0.2); color: var(--green-dot); }
        .status-badge.unavailable { background: rgba(231, 76, 60, 0.2); color: var(--red-dot); }

        .sizes-box { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .size-chip { flex: 1; min-width: 80px; background: #222; border: 1px solid #333; padding: 8px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .size-chip.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }
        .single-price { font-size: 1.1rem; font-weight: 800; color: var(--accent-color); margin-bottom: 12px; }

        .card-actions { display: flex; justify-content: space-between; align-items: center; }
        .counter-group { display: flex; align-items: center; background: #222; border-radius: 8px; padding: 2px; }
        .cnt-btn { width: 34px; height: 34px; background: var(--accent-color); color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .cnt-value { width: 35px; text-align: center; font-weight: 700; }
        .add-cart-btn { background: var(--accent-color); color: #000; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        .cart-bar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 576px; background: var(--accent-color); color: #000; padding: 12px 18px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .order-trigger-btn { background: #000; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 300; justify-content: center; align-items: center; padding: 15px; }
        .modal-body { background: var(--card-bg); border: 1px solid var(--border-color); width: 100%; max-width: 450px; border-radius: 16px; padding: 20px; max-height: 85vh; overflow-y: auto; }
        .close-btn { font-size: 1.3rem; cursor: pointer; color: #aaa; }
        
        .order-type-selector { display: flex; gap: 10px; margin: 15px 0; }
        .type-btn { flex: 1; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; }
        .type-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        .submit-whatsapp-btn { width: 100%; background: #25d366; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        let menuData = [];
        let currentCategory = 'الكل';
        let cart = [];
        let selectedSizes = {};
        let itemQuantities = {};

        db.ref('menuData').on('value', (snapshot) => {
            if (snapshot.exists()) {
                menuData = snapshot.val();
            } else {
                menuData = initialMenuData;
                db.ref('menuData').set(initialMenuData);
            }
            renderApp();
        });

        function renderApp() {
            if (!menuData || menuData.length === 0) return;
            const rawCategories = ['الكل', ...new Set(menuData.map(i => i.category))];

            document.getElementById('categoriesNav').innerHTML = rawCategories.map(cat => 
                `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>`
            ).join('');

            const itemsToDisplay = currentCategory === 'الكل' ? menuData : menuData.filter(i => i.category === currentCategory);

            document.getElementById('menuContainer').innerHTML = itemsToDisplay.map(item => {
                const isAvail = item.available !== false;
                const qty = itemQuantities[item.id] || 0;

                return `
                <div class="item-card">
                    <div class="item-top">
                        <div class="item-title-group">
                            <span class="item-name-ar">${item.name}</span>
                        </div>
                        <span class="status-badge ${isAvail ? 'available' : 'unavailable'}">
                            ${isAvail ? 'متاح' : 'غير متاح'}
                        </span>
                    </div>

                    ${item.sizes ? `
                    <div class="sizes-box">
                        ${Object.keys(item.sizes).map((size, index) => {
                            if(!selectedSizes[item.id] && index === 0) selectedSizes[item.id] = size;
                            const isSelected = selectedSizes[item.id] === size;
                            return `<div class="size-chip ${isSelected ? 'active' : ''}" onclick="selectItemSize('${item.id}', '${size}')">${size} ${item.sizes[size]} ج.م</div>`;
                        }).join('')}
                    </div>` : `<div class="single-price">${item.price} ج.م</div>`}

                    <div class="card-actions">
                        <div class="counter-group">
                            <button class="cnt-btn" ${!isAvail ? 'disabled' : ''} onclick="updateQty('${item.id}', -1)">-</button>
                            <span class="cnt-value">${qty}</span>
                            <button class="cnt-btn" ${!isAvail ? 'disabled' : ''} onclick="updateQty('${item.id}', 1)">+</button>
                        </div>
                        <button class="add-cart-btn" ${!isAvail ? 'disabled' : ''} onclick="addToCart('${item.id}')">إضافة للسلة</button>
                    </div>
                </div>`;
            }).join('');
        }

        function filterCategory(cat) { currentCategory = cat; renderApp(); }
        function selectItemSize(itemId, size) { selectedSizes[itemId] = size; renderApp(); }
        function updateQty(itemId, delta) {
            itemQuantities[itemId] = Math.max(0, (itemQuantities[itemId] || 0) + delta);
            renderApp();
        }

        function addToCart(itemId) {
            const qty = itemQuantities[itemId] || 0;
            if (qty <= 0) return;
            const item = menuData.find(i => i.id === itemId);
            let size = selectedSizes[itemId] || (item.sizes ? Object.keys(item.sizes)[0] : 'عادي');
            const price = item.sizes ? item.sizes[size] : item.price;

            cart.push({ id: item.id, name: item.name, size: size, price: price, qty: qty });
            itemQuantities[itemId] = 0;
            updateCartUI();
            renderApp();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartCount').innerText = totalCount;
            document.getElementById('cartTotal').innerText = totalPrice;
            document.getElementById('cartBar').style.display = totalCount > 0 ? 'flex' : 'none';
        }

        function openOrderModal() {
            document.getElementById('orderModal').style.display = 'flex';
            document.getElementById('cartSummaryList').innerHTML = cart.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.9rem;">
                    <span>${i.name} (${i.size}) x${i.qty}</span>
                    <b>${i.price * i.qty} ج.م</b>
                </div>
            `).join('');
        }

        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

        function setOrderType(type) {
            selectedOrderType = type;
            if(type === 'takeaway') {
                document.getElementById('btnTakeaway').classList.add('active');
                document.getElementById('btnHall').classList.remove('active');
                document.getElementById('tableSelectGroup').style.display = 'none';
            } else {
                document.getElementById('btnHall').classList.add('active');
                document.getElementById('btnTakeaway').classList.remove('active');
                document.getElementById('tableSelectGroup').style.display = 'block';
            }
        }

        function sendToWhatsApp() {
            let tableNum = "";
            if (selectedOrderType === 'hall') {
                tableNum = document.getElementById('tableNumber').value;
                if (!tableNum) {
                    alert("برجاء اختيار رقم الطاولة أولاً!");
                    return;
                }
            }

            let message = `*طلب جديد من المنيو*\n`;
            message += `----------------------------\n`;
            message += `*نوع الطلب:* ${selectedOrderType === 'takeaway' ? 'تيك أوي (Takeaway)' : 'صالة (' + tableNum + ')'}\n`;
            message += `----------------------------\n`;

            let total = 0;
            cart.forEach(i => {
                let sub = i.price * i.qty;
                total += sub;
                message += `• ${i.name} (${i.size}) x${i.qty} = ${sub} ج.م\n`;
            });

            message += `----------------------------\n*الإجمالي:* ${total} ج.م`;
            window.open(`https://wa.me/${whatsappPhone}?text=${encodeURIComponent(message)}`, '_blank');
        }
