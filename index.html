  <!-- =========================
     FARIS CAFE ORDER SYSTEM
     ========================= -->

<style>
/* أزرار + و - */
.faris-add-controls {
  display: flex !important;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  direction: ltr;
}

.faris-add-controls button {
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .15s;
}

.faris-minus {
  background: #eee;
  color: #222;
}

.faris-plus {
  background: #111;
  color: white;
}

.faris-add-controls button:active {
  transform: scale(.9);
}

.faris-qty {
  min-width: 25px;
  text-align: center;
  font-weight: bold;
  font-size: 15px;
}

/* زر السلة */
#faris-cart-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9998;
  background: #111;
  color: white;
  border: none;
  border-radius: 50px;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 5px 20px rgba(0,0,0,.25);
  cursor: pointer;
}

#faris-cart-count {
  background: #e53935;
  color: white;
  border-radius: 50%;
  min-width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 5px;
}

/* خلفية السلة */
#faris-cart-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 9999;
}

/* السلة */
#faris-cart {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 25px 25px 0 0;
  padding: 20px;
  box-sizing: border-box;
  direction: rtl;
}

#faris-cart h2 {
  margin: 0 0 15px;
  text-align: center;
}

.faris-close {
  position: absolute;
  left: 18px;
  top: 15px;
  border: none;
  background: #eee;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
}

.faris-cart-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.faris-cart-name {
  flex: 1;
  font-weight: bold;
}

.faris-cart-controls {
  display: flex;
  align-items: center;
  gap: 5px;
}

.faris-cart-controls button {
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 7px;
  background: #eee;
  font-weight: bold;
  font-size: 18px;
}

<!-- زر السلة -->
<button id="faris-cart-button" onclick="farisOpenCart()">
  🛒
  <span id="faris-cart-count">0</span>
  السلة
</button>


<!-- نافذة السلة -->
<div id="faris-cart-overlay" onclick="farisOverlayClick(event)">

  <div id="faris-cart">

    <button class="faris-close" onclick="farisCloseCart()">×</button>

    <h2>🛒 طلبك</h2>

    <div id="faris-cart-items"></div>

    <div class="faris-cart-total">
      عدد الأصناف: <span id="faris-total-items">0</span>
    </div>

    <div class="faris-table-box">
      <label>🪑 اختار رقم الترابيزة</label>

      <select id="faris-table-number">
        <option value="">-- اختار الترابيزة --</option>
        <option value="1">ترابيزة 1</option>
        <option value="2">ترابيزة 2</option>
        <option value="3">ترابيزة 3</option>
        <option value="4">ترابيزة 4</option>
        <option value="5">ترابيزة 5</option>
        <option value="6">ترابيزة 6</option>
        <option value="7">ترابيزة 7</option>
        <option value="8">ترابيزة 8</option>
        <option value="9">ترابيزة 9</option>
        <option value="10">ترابيزة 10</option>
      </select>
    </div>

    <button id="faris-whatsapp" onclick="farisSendWhatsApp()">
      📱 إرسال الطلب على واتساب
    </button>

    <button id="faris-clear-cart" onclick="farisClearCart()">
      🗑️ مسح الطلب
    </button>

  </div>

</div>


<script>
(function () {

  const STORAGE_KEY = "faris_cafe_cart_v1";

  let cart = {};

  try {
    cart = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    cart = {};
  }


  /* =========================
     حفظ السلة
     ========================= */

  function saveCart() {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(cart)
    );
  }


  /* =========================
     معرفة اسم الصنف
     ========================= */

  function getItemData(row) {

    let arabic = "";
    let english = "";

    const spans = row.querySelectorAll("span");

    spans.forEach(function (span) {

      const text = span.innerText.trim();

      if (!text) return;

      if (/[\u0600-\u06FF]/.test(text)) {
        if (!arabic) {
          arabic = text;
        }
      }

      if (
        /^[A-Za-z0-9 .,&'’\-()]+$/.test(text) &&
        /[A-Za-z]/.test(text)
      ) {
        if (!english) {
          english = text;
        }
      }

    });

    return {
      arabic: arabic || english || "صنف",
      english: english || arabic || "Item"
    };
  }


  /* =========================
     إضافة صنف
     ========================= */

  function addItem(row) {

    const data = getItemData(row);

    const key = data.english + "|" + data.arabic;

    if (!cart[key]) {

      cart[key] = {
        name: data.arabic,
        english: data.english,
        qty: 0
      };

    }

    cart[key].qty++;

    saveCart();
    updateAll();

  }


  /* =========================
     تقليل صنف
     ========================= */

  function removeItem(row) {

    const data = getItemData(row);

    const key = data.english + "|" + data.arabic;

    if (!cart[key]) return;

    cart[key].qty--;

    if (cart[key].qty <= 0) {
      delete cart[key];
    }

    saveCart();
    updateAll();

  }


  /* =========================
     إنشاء أزرار + و -
     ========================= */

  function addControls() {

    const rows = document.querySelectorAll(".group\\/item");

    rows.forEach(function (row) {

      if (row.querySelector(".faris-add-controls")) {
        return;
      }

      const data = getItemData(row);

      if (!data.arabic && !data.english) {
        return;
      }

      const controls = document.createElement("div");

      controls.className = "faris-add-controls";

      const minus = document.createElement("button");

      minus.className = "faris-minus";
      minus.innerHTML = "−";

      const qty = document.createElement("span");

      qty.className = "faris-qty";
      qty.innerText = "0";

      const plus = document.createElement("button");

      plus.className = "faris-plus";
      plus.innerHTML = "+";

      minus.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        removeItem(row);
      };

      plus.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        addItem(row);
      };

      controls.appendChild(minus);
      controls.appendChild(qty);
      controls.appendChild(plus);

      row.appendChild(controls);

    });

    updateControls();

  }


  /* =========================
     تحديث أرقام الأصناف
     ========================= */

  function updateControls() {

    const rows = document.querySelectorAll(".group\\/item");

    rows.forEach(function (row) {

      const controls =
        row.querySelector(".faris-add-controls");

      if (!controls) return;

      const data = getItemData(row);

      const key =
        data.english + "|" + data.arabic;

      const qty =
        cart[key] ? cart[key].qty : 0;

      const qtyElement =
        controls.querySelector(".faris-qty");

      if (qtyElement) {
        qtyElement.innerText = qty;
      }

    });

  }


  /* =========================
     تحديث السلة
     ========================= */

  function updateCart() {

    const container =
      document.getElementById("faris-cart-items");

    const countElement =
      document.getElementById("faris-cart-count");

    const totalItemsElement =
      document.getElementById("faris-total-items");

    if (!container) return;

    container.innerHTML = "";

    const keys = Object.keys(cart);

    let total = 0;

    keys.forEach(function (key) {

      const item = cart[key];

      total += item.qty;

      const div =
        document.createElement("div");

      div.className = "faris-cart-item";

      const name =
        document.createElement("div");

      name.className = "faris-cart-name";

      name.innerText =
        item.name;

      const controls =
        document.createElement("div");

      controls.className =
        "faris-cart-controls";

      const minus =
        document.createElement("button");

      minus.innerText = "−";

      const number =
        document.createElement("span");

      number.innerText =
        item.qty;

      number.style.minWidth = "25px";
      number.style.textAlign = "center";
      number.style.fontWeight = "bold";

      const plus =
        document.createElement("button");

      plus.innerText = "+";

      minus.onclick = function () {

        item.qty--;

        if (item.qty <= 0) {
          delete cart[key];
        }

        saveCart();
        updateAll();

      };

      plus.onclick = function () {

        item.qty++;

        saveCart();
        updateAll();

      };

      controls.appendChild(minus);
      controls.appendChild(number);
      controls.appendChild(plus);

      div.appendChild(name);
      div.appendChild(controls);

      container.appendChild(div);

    });


    if (keys.length === 0) {

      container.innerHTML =
        '<div class="faris-empty">🛒 السلة فاضية<br>اختار الأصناف من المنيو</div>';

    }


    countElement.innerText =
      total;

    totalItemsElement.innerText =
      total;

  }


  /* =========================
     فتح السلة
     ========================= */

  window.farisOpenCart = function () {

    updateCart();

    document.getElementById(
      "faris-cart-overlay"
    ).style.display = "block";

  };


  /* =========================
     إغلاق السلة
     ========================= */

  window.farisCloseCart = function () {

    document.getElementById(
      "faris-cart-overlay"
    ).style.display = "none";

  };


  /* =========================
     الضغط على الخلفية
     ========================= */

  window.farisOverlayClick = function (event) {

    if (
      event.target.id ===
      "faris-cart-overlay"
    ) {

      farisCloseCart();

    }

  };


  /* =========================
     مسح السلة
     ========================= */

  window.farisClearCart = function () {

    if (
      Object.keys(cart).length === 0
    ) {
      return;
    }

    if (
      !confirm("هل تريد مسح الطلب بالكامل؟")
    ) {
      return;
    }

    cart = {};

    saveCart();

    updateAll();

  };


  /* =========================
     إرسال واتساب
     ========================= */

  window.farisSendWhatsApp = function () {

    const keys = Object.keys(cart);

    if (keys.length === 0) {

      alert("من فضلك اختار صنف واحد على الأقل.");

      return;

    }


    const table =
      document.getElementById(
        "faris-table-number"
      ).value;


    if (!table) {

      alert("من فضلك اختار رقم الترابيزة.");

      return;

    }


    let message =
      "🍽️ *طلب جديد - Faris Cafe*%0A%0A";

    message +=
      "🪑 *رقم الترابيزة:* " +
      table +
      "%0A%0A";

    message +=
      "📋 *الطلب:*%0A";


    let total = 0;

    keys.forEach(function (key, index) {

      const item = cart[key];

      total += item.qty;

      message +=
        (index + 1) +
        "- " +
        item.name +
        " × " +
        item.qty +
        "%0A";

    });


    message +=
      "%0A🔢 *إجمالي عدد القطع:* " +
      total;


    const phone =
      "201090168784";

    const whatsappURL =
      "https://wa.me/" +
      phone +
      "?text=" +
      encodeURIComponent(
        decodeURIComponent(message)
      );


    window.open(
      whatsappURL,
      "_blank"
    );

  };


  /* =========================
     تحديث كل حاجة
     ========================= */

  function updateAll() {

    updateCart();
    updateControls();

  }


  /* =========================
     مراقبة React
     ========================= */

  const observer =
    new MutationObserver(function () {

      addControls();

    });


  observer.observe(
    document.body,
    {
      childList: true,
      subtree: true
    }
  );


  /* =========================
     تشغيل أول مرة
     ========================= */

  setTimeout(function () {

    addControls();
    updateAll();

  }, 1000);


})();
  </script>
