<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faris Cafe</title>
  
  <style>
    /* --- تنسيقات الموقع الأساسية --- */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
      padding-bottom: 90px; /* مساحة لعدم تغطية زر السلة للأصناف */
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0;
      color: #4a2c2a;
    }

    /* شبكة المنيو */
    .menu-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .menu-item {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .menu-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    .menu-item h3 {
      margin: 10px 0 5px;
      font-size: 16px;
    }

    .menu-item .price {
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 10px;
    }

    /* --- أزرار التحكم بالكمية (+ و -) --- */
    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #f1f1f1;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .qty-controls button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #007bff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .qty-controls button:active {
      transform: scale(0.92);
    }

    .item-qty {
      font-weight: bold;
      min-width: 15px;
      text-align: center;
    }

    /* --- زر السلة الثابت أسفل الشاشة --- */
    #cart-floating-btn {
      position: fixed;
      bottom: 20px;
      right: 50%;
      transform: translateX(50%);
      background-color: #25d366;
      color: #fff;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 1000;
      white-space: nowrap;
    }

    /* --- النافذة المنبثقة للسلة (Modal) --- */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1001;
      justify-content: center;
      align-items: flex-end;
    }

    .cart-content {
      background: #fff;
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .close-btn {
      font-size: 26px;
      cursor: pointer;
      color: #888;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .cart-empty-msg {
      text-align: center;
      padding: 30px 10px;
      color: #777;
      font-size: 16px;
    }

    .table-selection {
      margin: 20px 0 10px;
    }

    .table-selection select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-top: 5px;
      outline: none;
      background: #fff;
    }

    .cart-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-whatsapp {
      background-color: #25d366;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-clear {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ Faris Cafe</h1>
    <p>اختر طلبك من المنيو</p>
  </header>

  <!-- المنيو (يمكنك تعديل الألوان والصور والأسعار كما تحب) -->
  <div class="menu-container">

    <div class="menu-item">
      <img src="https://via.placeholder.com/150" alt="كابتشينو">
      <h3>كابتشينو</h3>
      <div class="price">45 ج.م</div>
      <div class="qty-controls" data-item="كابتشينو">
        <button onclick="changeQty('كابتشينو', -1)">−</button>
        <span class="item-qty" id="qty-كابتشينو">0</span>
        <button onclick="changeQty('كابتشينو', 1)">+</button>
      </div>
    </div>

    <div class="menu-item">
      <img src="https://via.placeholder.com/150" alt="عصير مانجا">
      <h3>عصير مانجا</h3>
      <div class="price">40 ج.م</div>
      <div class="qty-controls" data-item="عصير مانجا">
        <button onclick="changeQty('عصير مانجا', -1)">−</button>
        <span class="item-qty" id="qty-عصير مانجا">0</span>
        <button onclick="changeQty('عصير مانجا', 1)">+</button>
      </div>
    </div>

    <div class="menu-item">
      <img src="https://via.placeholder.com/150" alt="بيتزا">
      <h3>بيتزا</h3>
      <div class="price">90 ج.م</div>
      <div class="qty-controls" data-item="بيتزا">
        <button onclick="changeQty('بيتزا', -1)">−</button>
        <span class="item-qty" id="qty-بيتزا">0</span>
        <button onclick="changeQty('بيتزا', 1)">+</button>
      </div>
    </div>

  </div>

  <!-- زر السلة الثابت -->
  <div id="cart-floating-btn" onclick="toggleCart()">
    🛒 السلة (<span id="cart-count">0</span>)
  </div>

  <!-- نافذة السلة المنبثقة -->
  <div id="cart-modal" class="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h3>🛒 سلة الطلبات - Faris Cafe</h3>
        <span class="close-btn" onclick="toggleCart()">&times;</span>
      </div>

      <div id="cart-items">
        <!-- يتم تحميل المحتوى ديناميكيًا -->
      </div>

      <div id="table-selection" class="table-selection" style="display: none;">
        <label for="table-number">🪑 اختر رقم الترابيزة:</label>
        <select id="table-number">
          <option value="">-- اختار رقم الترابيزة --</option>
          <option value="1">ترابيزة 1</option>
          <option value="2">ترابيزة 2</option>
          <option value="3">ترابيزة 3</option>
          <option value="4">ترابيزة 4</option>
          <option value="5">ترابيزة 5</option>
          <option value="6">ترابيزة 6</option>
          <option value="7">ترابيزة 7</option>
          <option value="8">ترابيزة 8</option>
          <option value="9">ترابيزة 9</option>
          <option value="10">ترابيزة 10</option>
        </select>
      </div>

      <div id="cart-actions" class="cart-actions" style="display: none;">
        <button class="btn-clear" onclick="clearCart()">🗑️ مسح الطلب بالكامل</button>
        <button class="btn-whatsapp" onclick="sendWhatsAppOrder()">📱 إرسال الطلب على واتساب</button>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // جلب البيانات من الحفظ المحلي LocalStorage
    let cart = JSON.parse(localStorage.getItem('faris_cafe_cart')) || {};

    document.addEventListener('DOMContentLoaded', () => {
      updateUI();
    });

    // زيادة أو إنقاص الكمية
    function changeQty(itemName, change) {
      if (!cart[itemName]) {
        cart[itemName] = 0;
      }

      cart[itemName] += change;

      // إزالة الصنف إذا وصل للصفر
      if (cart[itemName] <= 0) {
        delete cart[itemName];
      }

      saveCart();
      updateUI();
    }

    function saveCart() {
      localStorage.setItem('faris_cafe_cart', JSON.stringify(cart));
    }

    function clearCart() {
      cart = {};
      saveCart();
      updateUI();
    }

    // تحديث الواجهة والعدادات
    function updateUI() {
      let totalCount = 0;

      // تحديث الأرقام المكتوبة بجانب أزرار المنيو
      document.querySelectorAll('.qty-controls').forEach(control => {
        const itemName = control.getAttribute('data-item');
        const qtySpan = document.getElementById(`qty-${itemName}`);
        const currentQty = cart[itemName] || 0;
        
        if (qtySpan) {
          qtySpan.innerText = currentQty;
        }
      });

      // حساب إجمالي السلة
      for (let item in cart) {
        totalCount += cart[item];
      }

      document.getElementById('cart-count').innerText = totalCount;

      // تحديث عناصر السلة الداخلية
      const cartItemsContainer = document.getElementById('cart-items');
      const tableSelection = document.getElementById('table-selection');
      const cartActions = document.getElementById('cart-actions');

      if (totalCount === 0) {
        cartItemsContainer.innerHTML = '<div class="cart-empty-msg">السلة فاضية، اختار الأصناف من المنيو</div>';
        tableSelection.style.display = 'none';
        cartActions.style.display = 'none';
      } else {
        let itemsHTML = '';
        for (let item in cart) {
          itemsHTML += `
            <div class="cart-item-row">
              <span>${item}</span>
              <div class="qty-controls">
                <button onclick="changeQty('${item}', -1)">−</button>
                <span>${cart[item]}</span>
                <button onclick="changeQty('${item}', 1)">+</button>
              </div>
            </div>
          `;
        }
        cartItemsContainer.innerHTML = itemsHTML;
        tableSelection.style.display = 'block';
        cartActions.style.display = 'flex';
      }
    }

    // فتح وإغلاق السلة
    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    // إرسال الطلب عبر الواتساب
    function sendWhatsAppOrder() {
      const tableNumber = document.getElementById('table-number').value;

      if (!tableNumber) {
        alert('من فضلك اختر رقم الترابيزة أولاً قبل إرسال الطلب.');
        return;
      }

      let totalItemsCount = 0;
      let itemsListText = '';

      for (let item in cart) {
        itemsListText += `${item} × ${cart[item]}\n`;
        totalItemsCount += cart[item];
      }

      const message = `🍽️ طلب جديد - Faris Cafe\n` +
                      `🪑 رقم الترابيزة: ${tableNumber}\n` +
                      `📋 الطلب:\n${itemsListText}` +
                      `🔢 إجمالي عدد القطع: ${totalItemsCount}`;

      const phone = '201090168784';
      const whatsappURL = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

      window.open(whatsappURL, '_blank');
    }
  </script>

</body>
</html>
